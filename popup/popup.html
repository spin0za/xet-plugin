<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小鹅通播放助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="heading">
        <img class="mark" src="../icons/icon-48.png" alt="" />
        <div>
          <h1>小鹅通播放助手</h1>
          <p id="summary">正在检查当前网页…</p>
        </div>
      </div>

      <label class="setting">
        <span>
          <strong>自动切换</strong>
          <small>视频加载后选择“超清”</small>
        </span>
        <input id="global-toggle" type="checkbox" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <section class="keep-alive-card">
        <label class="setting keep-alive-setting">
          <span>
            <strong>自动保持登录</strong>
            <small>延长登录状态，减少反复微信扫码</small>
          </span>
          <input id="keep-alive-toggle" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <details class="developer-options">
        <summary>开发者模式</summary>
        <div class="developer-panel">
          <section id="site-section" class="developer-section" hidden>
            <div class="developer-target">
              <strong>当前网站</strong>
              <small id="hostname"></small>
            </div>
            <div class="developer-actions">
              <button id="site-button" type="button">在此网站启用</button>
              <small id="site-status"></small>
            </div>
            <p class="hint" id="hint" hidden></p>
          </section>

          <button id="manage-sites" class="manage-sites" type="button">
            <span>管理已启用的网站</span>
            <span aria-hidden="true">›</span>
          </button>
        </div>
      </details>
    </main>
    <script src="../src/site-access.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
