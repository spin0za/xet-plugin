<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小鹅通播放助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="heading">
        <img class="mark" src="../icons/icon-48.png" alt="" />
        <div>
          <h1>小鹅通播放助手</h1>
          <p id="summary" role="status" aria-live="polite">正在检查当前网页…</p>
        </div>
      </div>

      <label class="setting" for="global-toggle">
        <span>
          <strong id="quality-label">默认最高画质</strong>
          <small id="quality-description">视频加载后自动选择可用的最高画质</small>
        </span>
        <input id="global-toggle" type="checkbox" aria-labelledby="quality-label" aria-describedby="quality-description" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="setting volume-setting" for="volume-toggle">
        <span>
          <strong id="volume-label">默认最大音量</strong>
          <small id="volume-description">视频加载后默认音量为 100%</small>
        </span>
        <input id="volume-toggle" type="checkbox" aria-labelledby="volume-label" aria-describedby="volume-description" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <section class="keep-alive-card">
        <label class="setting keep-alive-setting" for="keep-alive-toggle">
          <span>
            <strong id="keep-alive-label">自动保持登录</strong>
            <small id="keep-alive-description">延长登录状态，免去反复扫码</small>
          </span>
          <input id="keep-alive-toggle" type="checkbox" aria-labelledby="keep-alive-label" aria-describedby="keep-alive-description" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <details class="developer-options">
        <summary>开发者模式</summary>
        <div class="developer-panel">
          <section id="site-section" class="developer-section" hidden>
            <div class="developer-target">
              <strong>当前网站</strong>
              <small id="hostname"></small>
            </div>
            <div class="developer-actions">
              <button id="site-button" type="button">在此网站启用</button>
              <small id="site-status"></small>
            </div>
            <p class="hint" id="hint" role="status" aria-live="polite" hidden></p>
          </section>

          <button id="manage-sites" class="manage-sites" type="button">
            <span>管理已启用的网站</span>
            <span aria-hidden="true">›</span>
          </button>
        </div>
      </details>
    </main>
    <script src="../src/site-access.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
