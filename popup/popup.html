<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小鹅通播放助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="heading">
        <img class="mark" src="../icons/icon-48.png" alt="" />
        <div>
          <h1>小鹅通播放助手</h1>
          <p id="summary">正在检查当前网页…</p>
        </div>
      </div>

      <label class="setting">
        <span>
          <strong>自动切换</strong>
          <small>视频加载后选择“超清”</small>
        </span>
        <input id="global-toggle" type="checkbox" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <section class="keep-alive-card">
        <label class="setting keep-alive-setting">
          <span>
            <strong>自动保持登录</strong>
            <small>延长登录状态，减少反复微信扫码</small>
          </span>
          <input id="keep-alive-toggle" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <section id="site-section" hidden>
        <div class="site-row">
          <span>
            <strong>当前网站</strong>
            <small id="hostname"></small>
          </span>
          <button id="site-button" type="button">在此网站启用</button>
        </div>
      </section>

      <p class="hint" id="hint" hidden></p>

      <details class="developer-options">
        <summary>开发者模式</summary>
        <div class="developer-panel">
          <div class="developer-target">
            <strong>保活网站</strong>
            <small id="keep-alive-target">尚未设置保活网站</small>
          </div>
          <div class="keep-alive-actions">
            <button id="keep-alive-test" class="secondary" type="button">
              立即测试
            </button>
            <small id="keep-alive-status">不会打开或显示标签页</small>
          </div>
        </div>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
